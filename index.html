<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>InsureHub — 보험영업 포털</title>
<!-- PWA -->
<meta name="application-name" content="InsureHub">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="InsureHub">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#185FA5">
<meta name="description" content="GA 통합 보험영업 포털">
<link id="manifestLink" rel="manifest" href="">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{--blue:#185FA5;--blue-lt:#E6F1FB;--blue-md:#378ADD;--blue-dk:#0C447C;--teal:#0F6E56;--teal-lt:#E1F5EE;--teal-md:#1D9E75;--amber:#BA7517;--amber-lt:#FAEEDA;--red:#A32D2D;--red-lt:#FCEBEB;--gray-50:#F8F9FA;--gray-100:#F1EFE8;--gray-200:#E2E0D6;--gray-400:#888780;--gray-600:#5F5E5A;--gray-800:#2C2C2A;--white:#ffffff;--border:rgba(0,0,0,0.09);--sidebar-w:220px;--header-h:56px;--bottom-nav-h:60px;--r-sm:6px;--r-md:10px;--r-lg:14px;font-family:'Pretendard',-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--gray-50);color:var(--gray-800);font-size:14px;line-height:1.5;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s;overflow-y:auto;}
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;}
  .header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;}
  .content{padding:24px;flex:1;max-width:1200px;width:100%;}
  .sidebar-brand{padding:12px 14px;display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;}
  .brand-logo{width:100%;max-width:176px;height:44px;object-fit:contain;object-position:left center;background:white;border-radius:var(--r-sm);}
  .sb-section{padding:10px 8px 2px;}
  .sb-label{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:3px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--gray-600);font-size:13px;transition:all .15s;text-decoration:none;}
  .nav-item:hover{background:var(--gray-100);color:var(--gray-800);}
  .nav-item.active{background:var(--blue-lt);color:var(--blue-dk);font-weight:600;}
  .nav-icon{width:16px;height:16px;flex-shrink:0;}
  .ext-arr{width:10px;height:10px;margin-left:auto;opacity:.35;flex-shrink:0;}
  .sidebar-footer{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);flex-shrink:0;}
  .user-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;}
  .user-card:hover{background:var(--gray-100);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--gray-600);}
  .page-title{font-size:15px;font-weight:600;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .date-chip{font-size:12px;color:var(--gray-400);padding:4px 10px;border:1px solid var(--border);border-radius:20px;}
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);background:var(--white);border-top:1px solid var(--border);z-index:100;}
  .bn-inner{display:flex;height:100%;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--gray-400);transition:color .15s;}
  .bn-item.active{color:var(--blue);}
  .bn-item svg{width:20px;height:20px;}
  .bn-label{font-size:10px;font-weight:600;}
  .page{display:none;}.page.active{display:block;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;}
  .card-title{font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .card-hint{font-size:11px;color:var(--gray-400);font-weight:400;}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.blue{background:var(--blue-lt);color:var(--blue-dk);}.badge.teal{background:var(--teal-lt);color:var(--teal);}.badge.gray{background:var(--gray-100);color:var(--gray-600);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--gray-600);transition:all .15s;font-family:inherit;}
  .btn:hover{background:var(--gray-100);}
  .btn.primary{background:var(--blue);color:white;border-color:var(--blue);}
  .btn.primary:hover{background:var(--blue-dk);}
  .btn svg{width:13px;height:13px;}
  .sec-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;}
  .sec-title{font-size:18px;font-weight:700;}
  .sec-sub{font-size:13px;color:var(--gray-400);margin-top:2px;}
  /* modal */
  .modal-wrap{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.38);align-items:center;justify-content:center;padding:16px;}
  .modal-wrap.open{display:flex;}
  .modal{background:var(--white);border-radius:var(--r-lg);padding:24px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
  .fg{margin-bottom:13px;}.fl{font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:4px;display:block;}
  .fi{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;font-size:13px;outline:none;font-family:inherit;}
  .fi:focus{border-color:var(--blue-md);}
  .fsel{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;font-size:13px;outline:none;font-family:inherit;background:var(--white);}
  .ma{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  /* quick links */
  .ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:20px;}
  .ql-card{display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;text-decoration:none;color:inherit;cursor:pointer;transition:all .15s;}
  .ql-card:hover{border-color:var(--blue-md);box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .ql-icon{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ql-label{font-size:13px;font-weight:600;}
  .ql-sub{font-size:11px;color:var(--gray-400);margin-top:1px;}
  .ql-arr{margin-left:auto;opacity:.25;flex-shrink:0;}
  /* ai tools */
  .ai-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .ai-card{text-decoration:none;color:inherit;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:all .15s;display:flex;flex-direction:column;cursor:pointer;}
  .ai-card:hover{border-color:var(--blue-md);box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px);}
  .ai-thumb{height:108px;position:relative;overflow:hidden;flex-shrink:0;}
  .ai-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;}
  .ai-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
  .ai-emoji{font-size:26px;line-height:1;}
  .ai-name{font-size:12px;font-weight:700;text-align:center;color:#fff;line-height:1.2;}
  .ai-body{padding:9px 11px 11px;background:var(--white);flex:1;}
  .ai-bname{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:2px;line-height:1.3;}
  .ai-bdesc{font-size:11px;color:var(--gray-400);line-height:1.3;}
  /* platforms */
  .plat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .plat-card{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;cursor:pointer;transition:all .15s;}
  .plat-card:hover{border-color:var(--blue-md);box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px);}
  .plat-thumb{height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
  .plat-name{font-size:13px;font-weight:700;}
  .plat-sub{font-size:10px;}
  .plat-foot{padding:8px 12px;background:var(--white);}
  /* settings */
  .sg{margin-bottom:22px;}
  .sg-title{font-size:13px;font-weight:700;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .lr{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:7px;transition:opacity .2s;}
  .lr.hidden{opacity:.4;}
  .lr-icon{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .lr-info{flex:1;min-width:0;}
  .lr-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lr-url{font-size:11px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lr-acts{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .ia{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:12px;transition:all .15s;font-family:inherit;}
  .ia:hover{background:var(--gray-100);color:var(--gray-800);}
  .ia:disabled{opacity:.25;cursor:default;}
  .ia.del:hover{background:var(--red-lt);color:var(--red);border-color:transparent;}
  .tog{width:38px;height:22px;border-radius:11px;background:var(--gray-200);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;padding:0;}
  .tog.on{background:var(--blue);}
  .tog-k{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:white;transition:left .2s;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .tog.on .tog-k{left:19px;}
  /* SETTINGS TABS */
  .set-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
  .set-tabs::-webkit-scrollbar{display:none;}
  .set-tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--gray-400);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0;}
  .set-tab:hover{color:var(--gray-800);}
  .set-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
  /* overlay / fab */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;}
  .overlay.show{display:block;}
  .fab{position:fixed;bottom:calc(var(--bottom-nav-h)+16px);right:16px;width:50px;height:50px;background:var(--blue);border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(24,95,165,.35);z-index:90;}
  .fab svg{width:22px;height:22px;fill:white;}
  @media(max-width:768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vw rgba(0,0,0,.3);}
    .main{margin-left:0;padding-bottom:var(--bottom-nav-h);}
    .content{padding:16px;}
    .menu-btn{display:flex;}
    .bottom-nav{display:block;}
    .fab{display:flex;}
    .ai-grid{grid-template-columns:repeat(3,1fr);}
    .date-chip{display:none;}
  }
  @media(max-width:500px){.ai-grid{grid-template-columns:repeat(2,1fr);}.plat-grid{grid-template-columns:repeat(3,1fr);}}
  /* PWA INSTALL BANNER */
  .pwa-banner{display:none;position:fixed;bottom:calc(var(--bottom-nav-h) + 12px);left:12px;right:12px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:150;align-items:center;gap:12px;}
  .pwa-banner.show{display:flex;}
  .pwa-banner-icon{width:44px;height:44px;background:var(--blue);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pwa-banner-icon svg{width:22px;height:22px;fill:white;}
  .pwa-banner-text{flex:1;}
  .pwa-banner-title{font-size:13px;font-weight:700;color:var(--gray-800);}
  .pwa-banner-sub{font-size:11px;color:var(--gray-400);margin-top:1px;}
  .pwa-banner-actions{display:flex;gap:6px;flex-shrink:0;}
  .pwa-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--gray-100);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-600);font-size:14px;}
  /* PC install toast */
  .pwa-toast{display:none;position:fixed;top:70px;right:16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:150;min-width:280px;}
  .pwa-toast.show{display:block;}
  .pwa-toast-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .pwa-toast-sub{font-size:12px;color:var(--gray-400);margin-bottom:12px;}
  .pwa-toast-actions{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<!-- PWA MOBILE INSTALL BANNER -->
<div class="pwa-banner" id="pwaBanner">
  <div class="pwa-banner-icon"><svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"/></svg></div>
  <div class="pwa-banner-text">
    <div class="pwa-banner-title">InsureHub 앱 설치</div>
    <div class="pwa-banner-sub">홈 화면에 추가하여 앱처럼 사용</div>
  </div>
  <div class="pwa-banner-actions">
    <button class="btn primary" id="pwaInstallBtn" style="height:30px;font-size:12px;padding:0 12px">설치</button>
    <button class="pwa-close" onclick="dismissBanner()">✕</button>
  </div>
</div>

<!-- PC INSTALL TOAST -->
<div class="pwa-toast" id="pwaToast">
  <div class="pwa-toast-title">
    <div style="width:28px;height:28px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"/></svg></div>
    InsureHub 설치
  </div>
  <div class="pwa-toast-sub">PC에 앱으로 설치하면 바탕화면에서 바로 실행할 수 있습니다.</div>
  <div class="pwa-toast-actions">
    <button class="btn" style="height:30px;font-size:12px" onclick="document.getElementById('pwaToast').classList.remove('show')">나중에</button>
    <button class="btn primary" id="pcInstallBtn" style="height:30px;font-size:12px;padding:0 14px">설치하기</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- ADD LINK MODAL -->
<div class="modal-wrap" id="addLinkModal">
  <div class="modal">
    <div class="modal-title">링크 추가</div>
    <div class="fg"><label class="fl">이름 *</label><input class="fi" id="nl-name" placeholder="예: 삼성생명 전산"></div>
    <div class="fg"><label class="fl">URL *</label><input class="fi" id="nl-url" placeholder="https://..."></div>
    <div class="fg"><label class="fl">설명 (선택)</label><input class="fi" id="nl-desc" placeholder="간단한 설명"></div>
    <div class="fg"><label class="fl">분류</label>
      <select class="fsel" id="nl-group">
        <option value="quick">빠른 링크 (상단 카드)</option>
        <option value="system">외부 시스템</option>
        <option value="ai">AI 도구</option>
        <option value="platform">AI 플랫폼</option>
      </select>
    </div>
    <div class="fg"><label class="fl">아이콘 이모지</label><input class="fi" id="nl-emoji" placeholder="🔗" maxlength="4" style="width:80px"></div>
    <div class="ma">
      <button class="btn" onclick="closeModal('addLinkModal')">취소</button>
      <button class="btn primary" onclick="addLink()">추가</button>
    </div>
  </div>
</div>

  <!-- SIDEBAR -->

/* ── STORAGE ── */
function load(){try{const s=localStorage.getItem('ih2_links');return s?JSON.parse(s):JSON.parse(JSON.stringify(DEF));}catch{return JSON.parse(JSON.stringify(DEF));}}
function save(){localStorage.setItem('ih2_links',JSON.stringify(LINKS));}
let LINKS=load();

/* ── RENDER SIDEBAR ── */
function renderSB(){
  const GL={quick:'빠른 링크',system:'외부 시스템',ai:'AI 도구',platform:'AI 플랫폼'};
  const groups={};
  LINKS.filter(l=>l.visible).forEach(l=>{if(!groups[l.group])groups[l.group]=[];groups[l.group].push(l);});
  let h='';
  ['quick','system','ai','platform'].forEach(g=>{
    const items=groups[g];if(!items||!items.length)return;
    h+=`<div class="sb-section"><div class="sb-label">${GL[g]||g}</div>`;
    items.forEach(l=>{
      const url=l.web||l.url;
      if(l.group==='platform'){
        h+=`<div class="nav-item" onclick="openPlat('${l.id}')"><span style="font-size:14px;width:16px;text-align:center">${l.emoji||'🤖'}</span>${l.name}${EXT}</div>`;
      }else{
        h+=`<a class="nav-item" href="${url}" target="_blank" rel="noopener"><span style="font-size:14px;width:16px;text-align:center">${l.emoji||'🔗'}</span>${l.name}${EXT}</a>`;
      }
    });
    h+='</div>';
  });
  document.getElementById('sbLinks').innerHTML=h;
}

/* ── RENDER DASHBOARD ── */
function renderDash(){
  const quick=LINKS.filter(l=>l.group==='quick'&&l.visible);
  const ai=LINKS.filter(l=>l.group==='ai'&&l.visible);
  const plat=LINKS.filter(l=>l.group==='platform'&&l.visible);
  let h='';

  if(quick.length){
    h+=`<div class="ql-grid">`;
    quick.forEach(l=>{
      const hasMobile = l.ios || l.android;
      const tag = hasMobile ? 'div' : 'a';
      const attr = hasMobile
        ? `class="ql-card" onclick="openQL('${l.id}')" style="cursor:pointer"`
        : `class="ql-card" href="${l.url}" target="_blank" rel="noopener"`;
      const mobileBadge = hasMobile ? `<span style="font-size:9px;background:#E3F2FD;color:#1565C0;padding:1px 5px;border-radius:8px;font-weight:600;margin-left:4px">앱</span>` : '';
      h+=`<${tag} ${attr}>
        <div class="ql-icon" style="background:${l.imgSrc?'transparent':l.bg||'#eee'}">${l.imgSrc?`<img src='${l.imgSrc}' style='width:32px;height:32px;object-fit:contain;border-radius:6px'>`:l.emoji||'🔗'}</div>
        <div><div class="ql-label">${l.name}${mobileBadge}</div><div class="ql-sub">${l.desc||''}</div></div>
        <svg class="ql-arr" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </${tag}>`;
    });
    h+=`</div>`;
  }

  if(ai.length){
    h+=`<div class="card" style="margin-bottom:20px"><div class="card-title">AI 도구 모음 <span class="card-hint">INSUconsulting</span></div><div class="ai-grid">`;
    ai.forEach(l=>{
      h+=`<a class="ai-card" href="${l.url}" target="_blank" rel="noopener">
        <div class="ai-thumb" style="background:${l.tbg||'#222'}">
          <div class="ai-inner">
            <div class="ai-badge" style="background:rgba(255,255,255,.13);color:${l.bdCol||'#fff'}">${l.badge||''}</div>
            <div class="ai-emoji">${l.emoji||'🤖'}</div>
            <div class="ai-name">${l.name}</div>
          </div>
        </div>
        <div class="ai-body"><div class="ai-bname">${l.name}</div><div class="ai-bdesc">${l.desc||''}</div></div>
      </a>`;
    });
    h+=`</div></div>`;
  }

  if(plat.length){
    h+=`<div class="card" style="margin-bottom:20px"><div class="card-title">AI 플랫폼 <span class="card-hint">모바일에서 앱으로 연결</span></div><div class="plat-grid">`;
    plat.forEach(l=>{
      const bdg=l.id==='chatgpt'?'gray':l.id==='gemini'?'blue':'teal';
      h+=`<div class="plat-card" onclick="openPlat('${l.id}')">
        <div class="plat-thumb" style="background:${l.tbg||'#333'}">
          ${PSVG[l.id]||`<span style="font-size:30px">${l.emoji||'🤖'}</span>`}
          <div class="plat-name" style="color:#fff">${l.name}</div>
          <div class="plat-sub" style="color:rgba(255,255,255,.5)">${l.sub||''}</div>
        </div>
        <div class="plat-foot"><span class="badge ${bdg}">앱 연결</span></div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  document.getElementById('dashContent').innerHTML=h;
}

/* ── RENDER SETTINGS ── */
let _settingsTab = 'quick';
function renderSettings(){
  const GL={quick:'빠른 링크',system:'외부 시스템',ai:'AI 도구',platform:'AI 플랫폼'};
  const order=['quick','system','ai','platform'];
  // Make sure active tab has items, otherwise pick first with items
  const hasItems = order.filter(g => LINKS.some(l=>l.group===g));
  if(!hasItems.includes(_settingsTab)) _settingsTab = hasItems[0]||'quick';

  // Tabs
  let h=`<div class="set-tabs">`;
  order.forEach(g=>{
    const cnt=LINKS.filter(l=>l.group===g).length;
    if(!cnt) return;
    const active=g===_settingsTab?'active':'';
    h+=`<div class="set-tab ${active}" onclick="switchSettingsTab('${g}')">${GL[g]||g} <span style="font-size:10px;opacity:.6">${cnt}</span></div>`;
  });
  h+=`</div>`;

  // Items for active tab
  const items=LINKS.map((l,i)=>({...l,_i:i})).filter(x=>x.group===_settingsTab);
  if(!items.length){ h+=`<p style="color:var(--gray-400);font-size:13px;padding:20px 0">항목이 없습니다.</p>`; }
  items.forEach((l,pos)=>{
    const bgStyle=l.bg||l.tbg||'var(--gray-100)';
    const isGrad=bgStyle.includes('gradient');
    const iconStyle=isGrad?'background:var(--gray-100)':'background:'+bgStyle;
    h+=`<div class="lr ${l.visible?'':'hidden'}">
      <div class="lr-icon" style="${l.imgSrc?'background:transparent;padding:0;overflow:hidden':iconStyle}">${l.imgSrc?`<img src='${l.imgSrc}' style='width:32px;height:32px;object-fit:contain;border-radius:4px'>`:l.emoji||'🔗'}</div>
      <div class="lr-info">
        <div class="lr-name">${l.name}</div>
        <div class="lr-url">${l.url||l.web||''}</div>
      </div>
      <div class="lr-acts">
        <button class="ia" onclick="mvLink(${l._i},-1)" ${pos===0?'disabled':''}>↑</button>
        <button class="ia" onclick="mvLink(${l._i},1)" ${pos===items.length-1?'disabled':''}>↓</button>
        <button class="tog ${l.visible?'on':''}" onclick="togLink(${l._i})"><span class="tog-k"></span></button>
        <button class="ia del" onclick="delLink(${l._i})">✕</button>
      </div>
    </div>`;
  });
  document.getElementById('settingsContent').innerHTML=h;
}
function switchSettingsTab(g){ _settingsTab=g; renderSettings(); }

/* ── ACTIONS ── */
function mvLink(idx,dir){
  const g=LINKS[idx].group;
  const same=LINKS.map((l,i)=>({l,i})).filter(x=>x.l.group===g);
  const pos=same.findIndex(x=>x.i===idx);
  const np=pos+dir;
  if(np<0||np>=same.length)return;
  const si=same[np].i;
  [LINKS[idx],LINKS[si]]=[LINKS[si],LINKS[idx]];
  save();renderAll();
}
function togLink(idx){LINKS[idx].visible=!LINKS[idx].visible;save();renderAll();}
function delLink(idx){if(!confirm(`"${LINKS[idx].name}" 링크를 삭제할까요?`))return;LINKS.splice(idx,1);save();renderAll();}
function addLink(){
  const name=document.getElementById('nl-name').value.trim();
  const url=document.getElementById('nl-url').value.trim();
  const desc=document.getElementById('nl-desc').value.trim();
  const group=document.getElementById('nl-group').value;
  const emoji=document.getElementById('nl-emoji').value.trim()||'🔗';
  if(!name||!url){alert('이름과 URL을 입력해주세요.');return;}
  LINKS.push({id:'c'+Date.now(),group,name,url,desc,emoji,bg:'#E6F1FB',col:'#185FA5',visible:true});
  save();renderAll();closeModal('addLinkModal');
  ['nl-name','nl-url','nl-desc','nl-emoji'].forEach(id=>document.getElementById(id).value='');
}

/* ── QUICK LINK OPEN (mobile-aware) ── */
function openQL(id){
  const l=LINKS.find(x=>x.id===id);
  if(!l)return;
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAnd=/Android/i.test(navigator.userAgent);
  if(isIOS&&l.ios) window.open(l.ios,'_blank');
  else if(isAnd&&l.android) window.open(l.android,'_blank');
  else window.open(l.url,'_blank');
}

/* ── PLATFORM OPEN (with deep link + fallback) ── */
function openPlat(id){
  const l=LINKS.find(x=>x.id===id);
  if(!l)return;
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAnd=/Android/i.test(navigator.userAgent);
  const isMobile=isIOS||isAnd;

  if(isMobile && l.deeplink){
    // Try deep link first; if app not installed, fall back to store after timeout
    const fallback = isIOS ? l.ios : l.android;
    const start = Date.now();
    window.location.href = l.deeplink;
    setTimeout(()=>{
      // If we're still here after 1.5s, app probably not installed → go to store
      if(Date.now()-start < 2000) window.open(fallback,'_blank');
    }, 1500);
  } else if(isMobile){
    if(isIOS&&l.ios) window.open(l.ios,'_blank');
    else if(isAnd&&l.android) window.open(l.android,'_blank');
    else window.open(l.web||l.url,'_blank');
  } else {
    window.open(l.web||l.url,'_blank');
  }
}

/* ── NAV ── */
const PT={dashboard:'대시보드',settings:'링크 설정'};
const BN={dashboard:'bn-dashboard',settings:'bn-settings'};
function goto(page,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('active'));
  const pg=document.getElementById('page-'+page);if(pg)pg.classList.add('active');
  if(el)el.classList.add('active');
  else{const ni=document.getElementById('nav-'+page);if(ni)ni.classList.add('active');}
  document.getElementById('pageTitle').textContent=PT[page]||page;
  if(BN[page])document.getElementById(BN[page])?.classList.add('active');
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
}
function toggleSB(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');});
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function renderAll(){renderSB();renderDash();renderSettings();syncLogo();}

/* ── LOGO ── */
// Single source of truth: ACTIVE_LOGO
let ACTIVE_LOGO = localStorage.getItem('ih2_logo') || null;

function syncLogo(){
  const sidebar = document.querySelector('.brand-logo');
  const preview = document.getElementById('logoPreview');
  const src = ACTIVE_LOGO || (sidebar ? sidebar.getAttribute('data-default') : null);
  if(!src) return;
  if(sidebar && sidebar.src !== src) sidebar.src = src;
  if(preview) preview.src = src;
}

function changeLogo(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    ACTIVE_LOGO = e.target.result;
    localStorage.setItem('ih2_logo', ACTIVE_LOGO);
    syncLogo();
  };
  reader.readAsDataURL(file);
}

function resetLogo(){
  if(!confirm('로고를 기본값으로 초기화할까요?')) return;
  localStorage.removeItem('ih2_logo');
  ACTIVE_LOGO = null;
  const sidebar = document.querySelector('.brand-logo');
  if(sidebar){
    const def = sidebar.getAttribute('data-default');
    if(def){ sidebar.src = def; ACTIVE_LOGO = null; }
  }
  const preview = document.getElementById('logoPreview');
  if(preview && sidebar) preview.src = sidebar.src;
}

const wd=['일','월','화','수','목','금','토'],nd=new Date();
document.getElementById('dateChip').textContent=`${nd.getFullYear()}년 ${nd.getMonth()+1}월 ${nd.getDate()}일 ${wd[nd.getDay()]}요일`;

renderAll();

// Service Worker (inline via blob)
const swCode = `
const CACHE='insurehub-v1';
const ASSETS=['./'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./')))));
`;
const swBlob = new Blob([swCode], {type:'application/javascript'});
const swURL = URL.createObjectURL(swBlob);
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register(swURL, {scope:'./'}).catch(()=>{});
}

// Install prompt handling
let deferredPrompt = null;
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const hBtn = document.getElementById('headerInstallBtn');
  hBtn.style.display = 'inline-flex';
  if (!isMobile) {
    // PC: show toast after 2s
    setTimeout(() => document.getElementById('pwaToast').classList.add('show'), 2000);
  } else {
    document.getElementById('pwaBanner').classList.add('show');
  }
});

window.addEventListener('appinstalled', () => {
  document.getElementById('pwaBanner').classList.remove('show');
  document.getElementById('pwaToast').classList.remove('show');
  document.getElementById('headerInstallBtn').style.display = 'none';
  deferredPrompt = null;
});

// iOS: show manual install guide (no beforeinstallprompt on Safari)
if (isIOS && !navigator.standalone) {
  setTimeout(() => {
    const banner = document.getElementById('pwaBanner');
    banner.querySelector('.pwa-banner-sub').textContent = '사파리 → 공유 → 홈 화면에 추가';
    banner.querySelector('#pwaInstallBtn').textContent = '방법 보기';
    banner.querySelector('#pwaInstallBtn').onclick = () => {
      alert('📲 설치 방법\n\n1. 하단 공유 버튼(□↑) 탭\n2. "홈 화면에 추가" 선택\n3. 추가 버튼 탭\n\n바탕화면에서 앱처럼 실행됩니다!');
    };
    banner.classList.add('show');
  }, 3000);
}

async function showInstallUI() {
  if (deferredPrompt) {
    if (!isMobile) document.getElementById('pwaToast').classList.toggle('show');
    else triggerInstall();
  } else if (isIOS) {
    alert('📲 설치 방법\n\n1. 하단 공유 버튼(□↑) 탭\n2. "홈 화면에 추가" 선택\n3. 추가 버튼 탭');
  }
}

async function triggerInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('pwaBanner').classList.remove('show');
    document.getElementById('pwaToast').classList.remove('show');
  }
  deferredPrompt = null;
}

document.getElementById('pwaInstallBtn').addEventListener('click', triggerInstall);
document.getElementById('pcInstallBtn').addEventListener('click', triggerInstall);
function dismissBanner() {
  document.getElementById('pwaBanner').classList.remove('show');
  sessionStorage.setItem('pwa_dismissed','1');
}
</script>
